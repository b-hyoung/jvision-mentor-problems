name: Merge Answer PR When Ready

on:
  workflow_run:
    workflows:
      - AI 답안 검토
      - 허용 리뷰어 승인 검사
    types:
      - completed

jobs:
  merge-when-ready:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Merge PR when ready
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!run) {
              core.setFailed('Workflow run payload is missing.');
              return;
            }

            if (!['pull_request', 'pull_request_review'].includes(run.event)) {
              core.info(`Skipping event ${run.event}.`);
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headBranch = run.head_branch;
            if (!headBranch) {
              core.info('No head branch found on workflow run.');
              return;
            }

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              head: `${owner}:${headBranch}`,
              per_page: 100,
            });

            if (prs.length === 0) {
              core.info(`No open PR found for branch ${headBranch}.`);
              return;
            }

            const pr = prs[0];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const hasTargetChange = files.some(file =>
              file.filename.startsWith('answer/') || file.filename.startsWith('problems/')
            );
            if (!hasTargetChange) {
              core.info(`PR #${pr.number} has no answer/problems changes. Skipping.`);
              return;
            }

            if (pr.draft) {
              core.info(`PR #${pr.number} is a draft. Skipping.`);
              return;
            }

            const prInfo = await github.graphql(
              `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    id
                    number
                    mergeStateStatus
                    reviewDecision
                    autoMergeRequest {
                      enabledAt
                    }
                  }
                  mergeCommitAllowed
                  squashMergeAllowed
                  rebaseMergeAllowed
                }
              }
              `,
              {
                owner,
                repo,
                number: pr.number,
              }
            );

            const repository = prInfo.repository;
            const pullRequest = repository.pullRequest;

            if (!pullRequest) {
              core.setFailed(`PR #${pr.number} 정보를 가져오지 못했습니다.`);
              return;
            }

            if (pullRequest.reviewDecision !== 'APPROVED') {
              core.info(`PR #${pr.number} is not approved yet.`);
              return;
            }

            let mergeMethod = 'squash';
            if (repository.squashMergeAllowed) {
              mergeMethod = 'squash';
            } else if (repository.mergeCommitAllowed) {
              mergeMethod = 'merge';
            } else if (repository.rebaseMergeAllowed) {
              mergeMethod = 'rebase';
            }

            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const maxRetries = 5;
            for (let attempt = 1; attempt <= maxRetries; attempt++) {
              const fresh = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) { mergeStateStatus }
                  }
                }`,
                { owner, repo, number: pr.number }
              );
              const status = fresh.repository.pullRequest.mergeStateStatus;
              core.info(`PR #${pr.number} mergeStateStatus: ${status} (attempt ${attempt}/${maxRetries})`);

              if (status === 'CLEAN' || status === 'UNSTABLE') break;
              if (status === 'DIRTY' || status === 'UNKNOWN') {
                core.info(`PR #${pr.number} is not mergeable: ${status}`);
                return;
              }
              if (attempt === maxRetries) {
                core.info(`PR #${pr.number} still not CLEAN after ${maxRetries} attempts. Giving up.`);
                return;
              }
              await sleep(10000);
            }

            try {
              await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: mergeMethod,
              });
              core.info(`Merged PR #${pr.number} with ${mergeMethod}.`);
            } catch (error) {
              const message = String(error.message || error);
              if (message.includes('Pull Request is not mergeable')) {
                core.info(`PR #${pr.number} is no longer mergeable.`);
                return;
              }
              if (message.includes('is already merged')) {
                core.info(`PR #${pr.number} is already merged.`);
                return;
              }
              throw error;
            }
