name: 허용 리뷰어 승인 검사

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'answer/**'
  pull_request_review:
    types: [submitted, dismissed]

jobs:
  allowed-reviewer-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 허용 리뷰어 승인 확인
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const config = JSON.parse(fs.readFileSync('.github/allowed-reviewers.json', 'utf8'));
            const allowedReviewers = new Set(config.reviewers || []);

            if (allowedReviewers.size === 0) {
              core.setFailed('허용 리뷰어 목록이 비어 있습니다.');
              return;
            }

            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('PR 정보를 찾을 수 없습니다.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const hasAnswerChange = files.some(file => file.filename.startsWith('answer/'));
            if (!hasAnswerChange) {
              core.info('answer/** 변경이 없는 PR이라 검사를 건너뜁니다.');
              return;
            }

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const latestStateByUser = new Map();
            for (const review of reviews) {
              if (!review.user || !review.user.login) continue;
              latestStateByUser.set(review.user.login, review.state);
            }

            const approvedAllowedReviewers = [...latestStateByUser.entries()]
              .filter(([login, state]) => allowedReviewers.has(login) && state === 'APPROVED')
              .map(([login]) => login);

            if (approvedAllowedReviewers.length === 0) {
              core.setFailed(
                `허용된 리뷰어의 승인 1개가 필요합니다. 허용 리뷰어: ${[...allowedReviewers].join(', ')}`
              );
              return;
            }

            core.info(`승인 확인: ${approvedAllowedReviewers.join(', ')}`);
